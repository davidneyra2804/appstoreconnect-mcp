name: Publish

# Publishes the package to the public npm registry.
#
# Authentication uses OIDC (npm trusted publishing): npm exchanges this
# runner's identity token for a short-lived publish token, so no npm secret is
# stored in this repository. For that to work, a trusted publisher must be
# configured on npmjs.com for this repository and this workflow filename.
#
# The first version of a package has to be published by hand (npm login), since
# a trusted publisher can only be configured once the package exists.
#
# The package version in package.json is the one that is published, so it has
# to match the release tag. The job fails early if it does not.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install npm
        # Trusted publishing needs npm CLI 11.5.1 or later and Node 22.14 or later.
        run: npm install --global npm@latest

      - name: Install the dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck the sources and the tests
        run: npx tsc -p tsconfig.test.json

      - name: Test
        run: npm test

      - name: Check that the version matches the release tag
        if: ${{ github.event_name == 'release' }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "::error::The release tag ($tag) and the package version ($version) do not match."
            exit 1
          fi
          echo "The release tag and the package version agree: $version"

      - name: Check that the tarball is complete
        # The prepack script compiles the package, so the tarball always
        # carries dist/ and the bin entry exists even from a clean checkout.
        run: |
          npm pack --dry-run
          if [ ! -f dist/stdio.js ]; then
            echo "::error::dist/stdio.js is missing; the bin entry would be broken."
            exit 1
          fi

      - name: Publish
        # --provenance is set here and not in publishConfig: npm only generates
        # provenance inside GitHub Actions or GitLab CI, so pinning it in
        # publishConfig would break a manual publish from a laptop.
        run: npm publish --provenance --access public
